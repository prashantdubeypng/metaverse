events {
    worker_connections 4096;
    use epoll;
}

http {
    # WebSocket upstream (no sticky sessions!)
    upstream websocket_backend {
        least_conn; # Route to least busy server
        
        server ws1:3001 max_fails=3 fail_timeout=30s;
        server ws2:3001 max_fails=3 fail_timeout=30s;
        server ws3:3001 max_fails=3 fail_timeout=30s;
    }

    # Connection limits
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;

    # WebSocket proxy server
    server {
        listen 80;
        server_name _;

        # Connection limits
        limit_conn conn_limit_per_ip 10;
        limit_req zone=req_limit_per_ip burst=20 nodelay;

        # WebSocket endpoint
        location / {
            proxy_pass http://websocket_backend;
            
            # WebSocket headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Forward client info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts (keep WebSocket alive for up to 7 days)
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            
            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Disable cache
            proxy_cache off;
        }

        # Health check for load balancer itself
        location /nginx-health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Health check endpoint (separate port)
    server {
        listen 8080;
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Backend server health checks
        location /ws1/health {
            proxy_pass http://ws1:3011/health;
        }

        location /ws2/health {
            proxy_pass http://ws2:3011/health;
        }

        location /ws3/health {
            proxy_pass http://ws3:3011/health;
        }
    }
}
